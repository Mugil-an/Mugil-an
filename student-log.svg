<svg width="920" height="300" viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0020"/>
    <stop offset="100%" stop-color="#04000f"/>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00fff2"/>
    <stop offset="50%" stop-color="#ff00e6"/>
    <stop offset="100%" stop-color="#39ff14"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="transparent"/>
    <line x1="0" y1="0" x2="4" y2="0" stroke="#00fff2" stroke-opacity="0.05"/>
  </pattern>
</defs>

<rect x="4" y="4" width="912" height="292" rx="14" fill="url(#panelBg)"
